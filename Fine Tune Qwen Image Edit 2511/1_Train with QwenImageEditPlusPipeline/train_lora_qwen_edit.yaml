pretrained_model_name_or_path: /workspace/Qwen_Image_Edit/pretrained_model
data_config:
  train_batch_size: 1
  num_workers: 4
  img_size: 1024
  caption_dropout_rate: 0.1
  img_dir: /workspace/flymyai-lora-trainer/dataset/images
  control_dir: /workspace/flymyai-lora-trainer/dataset/control_images
  random_ratio: false # support multi crop preprocessing
  caption_type: txt
logging_steps: 1
report_to: wandb  # or "tensorboard"
tracker_project_name: qwen_lora_editing
train_batch_size: 1
output_dir: /workspace/flymyai-lora-trainer/test_lora_saves_edit
max_train_steps: 700
learning_rate: 2e-4
lr_scheduler: constant
lr_warmup_steps: 10
adam_beta1: 0.9
adam_beta2: 0.999
adam_weight_decay: 0.01
adam_epsilon: 1e-8
max_grad_norm: 1.0
logging_dir: logs
mixed_precision: "bf16"
checkpointing_steps: 50
checkpoints_total_limit: 10
resume_from_checkpoint: latest
gradient_accumulation_steps: 4
rank: 32
precompute_text_embeddings: true
precompute_image_embeddings: true
quantize: false
adam8bit: false
save_cache_on_disk: false